name: Security audit

on:
  push:
    branches: [main]
  schedule:
    # GitHub Actions cron cannot express an interval of two weeks.
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check schedule
        id: schedule
        shell: bash
        run: |
          # Count weeks from Monday, 2026-11-16 (UTC).
          weeks=$(( ($(date -u +%s) - $(date -u -d '2026-11-16' +%s)) / 604800 ))
          if [[ "${{ github.event_name }}" != "schedule" ]] || (( weeks % 2 == 0 )); then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.schedule.outputs.run == 'true'

      - name: Install cargo-audit
        if: steps.schedule.outputs.run == 'true'
        run: cargo install cargo-audit --locked

      - name: Audit dependencies
        if: steps.schedule.outputs.run == 'true'
        working-directory: rust
        run: cargo audit
