[package]
name = "lastbuy-sdk"
version = "0.1.0"
edition = "2024"

[dependencies]
solana-pubkey = { version = "4.4.0", features = ["borsh", "curve25519"] }
solana-instruction = "4.0.0"
borsh = { version = "1.8.1", features = ["derive"] }

[features]
default = ["full"]

full = ["events", "mainnet-beta"]

# includes `admin` ixs
dev = []
# incluses events
events = []

# clusters
# program ids may differ based on cluster and current state
# currently all clusters share the same LastBuy Bonding Curve Program ID
mainnet-beta = []
devnet = []
testnet = []