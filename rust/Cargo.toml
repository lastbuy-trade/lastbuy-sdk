[package]
name = "lastbuy-sdk"
version = "0.2.0"
edition = "2024"
description = "Low-level Rust SDK for the LastBuy bonding curve Solana program (instruction builders, PDAs, account/event types, constants)."
license = "Apache-2.0"
repository = "https://github.com/lastbuy-trade/lastbuy-sdk"
readme = "README.md"
keywords = ["solana", "anchor", "bonding-curve", "sdk", "lastbuy"]
categories = ["api-bindings", "cryptography::cryptocurrencies"]

[dependencies]
solana-pubkey = "4.4.0" 
solana-instruction = { version = "4.0.0", optional = true }
spl-associated-token-account-interface = { version = "2.0.0", optional = true }
borsh = { version = "1.8.1", optional = true }
thiserror = { version = "2.0.21", optional = true }

[features]
default = ["full"]

full = [
    "events",
    "parse-events", 
    "accounts", 
    "instructions", 
    "pda", 
    "error"
]

# includes `admin` ixs
dev = ["instructions"]
# incluses events
events = ["dep:borsh", "borsh/derive", "solana-pubkey/borsh"]
# includes events parsing
parse-events = ["events", "error"]
# includes types
types = ["dep:borsh", "borsh/derive", "solana-pubkey/borsh"]
# includes accounts
accounts = ["types"]
# includes error
error = ["dep:thiserror"]
# includes instructions
instructions = [
    "dep:solana-instruction",
    "dep:spl-associated-token-account-interface", 
    "pda",
    "types",
    "error"
]
# includes pda
pda = ["solana-pubkey/curve25519"]

[dev-dependencies]
dotenvy = "0.15.7"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time"] }
solana-rpc-client = "4.3.0"
solana-transaction = { version = "4.3.0", features = ["wincode"] }
solana-message = "4.3.0"
solana-keypair = "3.0.1"