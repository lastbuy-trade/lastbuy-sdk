[package]
name = "lastbuy-sdk"
version = "0.1.0"
edition = "2024"

[dependencies]
solana-pubkey = "4.4.0" 
solana-instruction = { version = "4.0.0", optional = true }
borsh = { version = "1.8.1", optional = true }

[features]
default = ["full"]

full = ["events", "accounts", "instructions", "pda"]

# includes `admin` ixs
dev = ["instructions"]
# incluses events
events = ["dep:borsh", "borsh/derive", "solana-pubkey/borsh"]
# includes accounts
accounts = ["dep:borsh", "borsh/derive", "solana-pubkey/borsh"]
# includes instructions
instructions = ["dep:solana-instruction", "pda"]
# includes pda
pda = ["solana-pubkey/curve25519"]